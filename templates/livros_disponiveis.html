{% extends 'base.html' %}

{% block main %}

<h2 class="page-title">Livros Disponíveis</h2>

<div class="card-list">
{% for item in livros_disponiveis.livros_disponiveis %}

    <p><strong>Título:</strong> {{item.titulo}}</p>
    <p><strong>Autor: </strong> {{item.autor}} </p>
    <p><strong>ISBN:</strong> {{item.ISBN}}</p>
    <p><strong>Resumo:</strong> {{item.resumo}}</p>

    <p><strong>Conteúdo:</strong>  {{item.leitura}}</p>
    <hr>




{% endfor %}
</div>
{% endblock %}
